<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL: PROJECT M-2026</title>
    <style>
        :root {
            --bg: #F4F1EA; /* 經典米色背景 */
            --navy: #2C3E50; /* 深藍色 */
            --accent: #C5A059; /* 焦糖金 */
        }

        body {
            background-color: var(--bg);
            color: var(--navy);
            font-family: 'Courier New', 'Microsoft JhengHei', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .system-box {
            width: 100%;
            max-width: 450px;
            border: 2px solid var(--navy);
            padding: 30px;
            background: #fff;
            box-shadow: 10px 10px 0px var(--navy);
            text-align: center;
        }

        .scene { display: none; }
        .scene.active { display: block; animation: fadeIn 0.6s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin: 20px 0; }
        input {
            background: #f9f9f9;
            border: 1px solid var(--navy);
            padding: 12px;
            width: 85%;
            font-size: 1rem;
            text-align: center;
            color: var(--navy);
        }

        button {
            background: var(--navy);
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        button:disabled { background: #ccc; cursor: not-allowed; }

        /* 新關卡：組件選取樣式 */
        .component-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }
        .comp-item {
            font-size: 2rem;
            padding: 15px;
            border: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 5px;
        }
        .comp-item.selected {
            background-color: var(--accent);
            border-color: var(--navy);
            transform: scale(0.9);
        }

        /* 第三關：大型進度滑桿 */
        .slider-container {
            margin: 40px 0;
            position: relative;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #eee;
            height: 15px;
            border-radius: 10px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: 3px solid var(--navy);
            border-radius: 50%;
            cursor: pointer;
        }

        #loading-text {
            font-weight: bold;
            color: var(--accent);
            height: 24px;
            margin-top: 15px;
        }

        .final-stats {
            text-align: left;
            background: #f4f4f4;
            padding: 15px;
            font-size: 0.9rem;
            line-height: 1.6;
            border-left: 4px solid var(--accent);
        }

        .photo-card {
            background: white;
            padding: 15px 15px 40px 15px;
            border: 1px solid #ddd;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            margin: 20px auto;
            max-width: 280px;
            transform: rotate(-3deg);
            transition: transform 0.5s ease;
        }

        .photo-card:hover { transform: rotate(0deg); }
        .photo-card img { width: 100%; height: auto; display: block; filter: sepia(10%); }

        .announcement-text {
            font-weight: bold;
            font-size: 1.5rem;
            color: #D35400;
            margin-top: 25px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="system-box">
    <div id="stage1" class="scene active">
        <p style="font-size: 0.8rem; opacity: 0.7;">> SYSTEM ID: ADMIN_TAIWAN</p>
        <h2>指令驗證</h2>
        <p>請輸入專案啟動碼：Persea</p>
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="Persea">
        </div>
        <button onclick="checkStage1()">執行指令</button>
    </div>

    <div id="stage2" class="scene">
        <h2>身分校準</h2>
        <p>請輸入當前企劃實施年份：</p>
        <div class="input-group">
            <input type="number" id="logicInput" placeholder="2026">
        </div>
        <button onclick="checkStage2()">驗證年份</button>
    </div>

    <div id="stage3" class="scene">
        <h2>核心組件選取</h2>
        <p>請選取 3 個符合「新計畫」的關鍵組件：</p>
        <div class="component-grid">
            <div class="comp-item" onclick="toggleComp(this)">🍼</div>
            <div class="comp-item" onclick="toggleComp(this)">🔧</div>
            <div class="comp-item" onclick="toggleComp(this)">🧸</div>
            <div class="comp-item" onclick="toggleComp(this)">🥣</div>
            <div class="comp-item" onclick="toggleComp(this)">💖</div>
            <div class="comp-item" onclick="toggleComp(this)">🛏️</div>
        </div>
        <p id="comp-msg" style="font-size: 0.85rem; color: #666;">等待配對中...</p>
        <button id="next3Btn" disabled onclick="nextStage(4)">解鎖系統</button>
    </div>

    <div id="stage4" class="scene">
        <h2>專案加載中...</h2>
        <p>請將滑桿拉至 100% 以部署專案</p>
        <div class="slider-container">
            <input type="range" id="loadSlider" min="0" max="100" value="0" oninput="updateLoading(this.value)">
            <div id="loading-text">進度：0%</div>
        </div>
        <div id="status-msg" style="font-size: 0.85rem; color: #666;">系統就緒中...</div>
        <button id="finalBtn" style="display:none;" onclick="nextStage(5)">完成部署</button>
    </div>

    <div id="stage5" class="scene">
        <h1 style="color: var(--accent);">SUCCESS!</h1>
        <hr>
        <div class="photo-card">
            <img src="IMG.jpg" alt="Our Little One">
        </div>
        <p class="announcement-text">我們懷孕了！👶</p>
        <div class="final-stats">
            > 預計上線日期：2026 年 11 月<br>
            > 冒險人數：2人 ➜ 3人<br>
            > 備註：家銘和茜茹小隊的新隊員！
        </div>
        <br>
        <button onclick="location.reload()">重新檢測系統</button>
    </div>
</div>

<script>
    function nextStage(n) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('stage' + n).classList.add('active');
    }

    function checkStage1() {
        const val = document.getElementById('cmdInput').value.trim();
        if(val.toLowerCase() === "persea") {
            nextStage(2);
        } else {
            alert("指令錯誤，請參考提示輸入。");
        }
    }

    function checkStage2() {
        const val = document.getElementById('logicInput').value;
        if(val === "2026") {
            nextStage(3);
        } else {
            alert("年份校準失敗，請輸入正確年份。");
        }
    }

    // 新增：組件選取邏輯
    let selectedCount = 0;
    function toggleComp(el) {
        if (!el.classList.contains('selected')) {
            el.classList.add('selected');
            selectedCount++;
        } else {
            el.classList.remove('selected');
            selectedCount--;
        }

        if (selectedCount >= 3) {
            document.getElementById('next3Btn').disabled = false;
            document.getElementById('comp-msg').innerText = "組件配對完成！";
        } else {
            document.getElementById('next3Btn').disabled = true;
            document.getElementById('comp-msg').innerText = "還需要 " + (3 - selectedCount) + " 個組件...";
        }
    }

    const statusMessages = {
        10: "正在尋找新成員...",
        30: "正在注入魔法能量...",
        50: "正在烘烤焦糖奶油...",
        70: "正在組裝木架...",
        90: "準備完成專案...",
        100: "部署完成，即將發布！"
    };

    function updateLoading(val) {
        document.getElementById('loading-text').innerText = "進度：" + val + "%";
        for (let percent in statusMessages) {
            if (val >= parseInt(percent)) {
                document.getElementById('status-msg').innerText = statusMessages[percent];
            }
        }
        if(val == 100) {
            document.getElementById('finalBtn').style.display = 'inline-block';
        }
    }
</script>

</body>
</html>
